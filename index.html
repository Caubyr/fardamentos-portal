<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal do Terceirizado — JCN Fardamentos</title>
<style>
:root{--ind:#16307A;--lar:#F0922E;--azu:#3E8FC6;--ink:#1D2233;--soft:#5B6178;--bg:#F4F6FB;--line:#DDE2EE;--red:#B3261E;--green:#1E8E5A}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.top img{max-height:64px;max-width:60%}
.bar{display:flex;height:4px;margin:6px 0 18px}.bar div{flex:1}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:20px;margin:0 0 4px;color:var(--ind)} h2{font-size:16px;margin:0 0 10px;color:var(--ind)} p.sub{margin:0 0 14px;color:var(--soft);font-size:14px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px;color:var(--soft)}
input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff}
button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--ind);color:#fff;font-size:16px;font-weight:700;margin-top:16px;cursor:pointer}
button.ghost{background:transparent;color:var(--ind);border:1px solid var(--line);margin-top:8px}button.link{background:none;color:var(--soft);width:auto;margin:0;padding:6px;font-size:13px;font-weight:400}
button:disabled{opacity:.5}
.prod{background:#EEF1FA;color:var(--ind);font-weight:700;font-size:14px;padding:9px 12px;border-radius:8px;margin:16px 0 6px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row .n{flex:1}.row .n small{display:block;color:var(--soft);font-size:12px}
.row input{width:96px;text-align:center}.row .t{width:92px;text-align:right;font-weight:700;font-size:14px}
.tot{display:flex;justify-content:space-between;font-size:19px;font-weight:700;margin-top:14px}
.msg{padding:12px;border-radius:10px;font-size:14px;margin-top:12px}.err{background:#FDECEA;color:var(--red)}.ok{background:#E6F5EE;color:var(--green)}
.hist{font-size:14px;padding:10px 0;border-bottom:1px solid var(--line)}.hist small{color:var(--soft)}
.hide{display:none}
</style></head><body><div class="wrap">

<div class="bar"><div style="background:#16307A"></div><div style="background:#F0922E"></div><div style="background:#3E8FC6"></div></div>

<div id="vLogin" class="card">
  <h1>Portal do Terceirizado</h1><p class="sub">Entre com seu e-mail e senha.</p>
  <label>E-mail</label><input id="lEmail" type="email" autocomplete="username" inputmode="email">
  <label>Senha</label><input id="lPass" type="password" autocomplete="current-password">
  <button id="btnIn">Entrar</button><div id="lMsg"></div>
</div>

<div id="vApp" class="hide">
  <div class="card"><h1 id="hello">Olá</h1><p class="sub">Informe o que você produziu. Os valores já estão cadastrados.</p>
    <label>Pedido</label><select id="sOrder"></select>
    <div id="rows"></div>
    <label>Observação (opcional)</label><input id="nNote" placeholder="Ex: peças entregues dia 17">
    <div class="tot"><span>Total</span><span id="tTot">R$ 0,00</span></div>
    <button id="btnSend">Enviar cobrança</button><div id="sMsg"></div>
  </div>
  <div class="card"><h2>Minhas cobranças enviadas</h2><div id="hist"></div></div>
</div>
</div>
<script>
const SB_URL='https://bgwqcuqgscsffjhtbxqh.supabase.co', SB_KEY='sb_publishable_Wbxilt-nIHIqt5MhvNyhxQ_h1-XDA4E';
const $=id=>document.getElementById(id);
const brl=n=>'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
let sess=null, services=[], orders=[], me=null;
const store={get(){try{return JSON.parse(localStorage.getItem('portal-sess')||'null')}catch(e){return null}},set(v){try{v?localStorage.setItem('portal-sess',JSON.stringify(v)):localStorage.removeItem('portal-sess')}catch(e){}}};
const H=()=>({apikey:SB_KEY,Authorization:'Bearer '+(sess?sess.access_token:SB_KEY),'Content-Type':'application/json'});
async function auth(body,grant){
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json(); if(!r.ok) throw new Error(d.error_description||d.msg||'Falha no login');
  sess={access_token:d.access_token,refresh_token:d.refresh_token,exp:Date.now()+d.expires_in*1000-60000}; store.set(sess);
}
async function api(path,opt){
  if(sess&&Date.now()>sess.exp){ try{ await auth({refresh_token:sess.refresh_token},'refresh_token'); }catch(e){ logout(); throw e; } }
  const r=await fetch(SB_URL+'/rest/v1/'+path,Object.assign({headers:H()},opt||{}));
  if(r.status===401){ logout(); throw new Error('Sessão expirada. Entre novamente.'); }
  if(!r.ok) throw new Error((await r.text())||'Erro'); const t=await r.text(); return t?JSON.parse(t):null;
}
function logout(){ sess=null; store.set(null); $('vApp').classList.add('hide'); $('vLogin').classList.remove('hide'); $('btnOut').classList.add('hide'); }
async function start(){
  $('vLogin').classList.add('hide'); $('vApp').classList.remove('hide'); $('btnOut').classList.remove('hide');
  const prof=await api('profiles?select=name,provider_key,role'); me=prof&&prof[0];
  if(!me||!me.provider_key){ $('vApp').innerHTML='<div class="card"><h1>Acesso não liberado</h1><p class="sub">Seu login ainda não foi vinculado. Fale com a JCN Fardamentos.</p></div>'; return; }
  $('hello').textContent='Olá, '+(me.name||'')+'!';
  [services,orders]=await Promise.all([api('provider_services?select=*&order=product_name'),api('provider_orders?select=*&order=order_code.desc')]);
  $('sOrder').innerHTML=orders.length?orders.map(o=>`<option value="${o.order_id}" data-c="${o.order_code}">Pedido #${esc(o.order_code)}${o.order_name?' — '+esc(o.order_name):''}</option>`).join(''):'<option value="">Nenhum pedido liberado</option>';
  drawRows(); loadHist();
}
function drawRows(){
  const ord=orders.find(o=>o.order_id===$('sOrder').value); const list=(ord&&Array.isArray(ord.product_ids))?services.filter(s=>ord.product_ids.includes(s.product_id)):services;
  const by={}; list.forEach(s=>(by[s.product_id]=by[s.product_id]||[]).push(s));
  $('rows').innerHTML=Object.keys(by).map(pid=>`<div class="prod"></div>`+by[pid].map(s=>`<div class="row"><div class="n">${esc(s.service_label)}<small>${brl(s.price)} / peça</small></div><input type="number" inputmode="numeric" min="0" data-p="${s.product_id}" data-s="${s.service}" placeholder="Qtd"><div class="t" data-t="${s.product_id}|${s.service}">${brl(0)}</div></div>`).join('')).join('');
  document.querySelectorAll('.prod').forEach((el,i)=>el.textContent=by[Object.keys(by)[i]][0].product_name);
  document.querySelectorAll('#rows input').forEach(i=>i.addEventListener('input',calc)); calc();
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function items(){ const out=[]; document.querySelectorAll('#rows input').forEach(i=>{const q=Math.round(Number(i.value)||0); if(q>0) out.push({product_id:i.dataset.p,service:i.dataset.s,qty:q});}); return out; }
function calc(){ let tot=0; document.querySelectorAll('#rows input').forEach(i=>{ const s=services.find(x=>x.product_id===i.dataset.p&&x.service===i.dataset.s); const t=(Number(i.value)||0)*Number(s.price); tot+=t; document.querySelector('[data-t="'+i.dataset.p+'|'+i.dataset.s+'"]').textContent=brl(t); }); $('tTot').textContent=brl(tot); }
function stLabel(c){ const n=c.status_note?': '+esc(c.status_note):''; const m={pending:['Enviada — aguardando a JCN','#5B6178'],received:['Em análise na JCN','#9A5A10'],approved:['Aprovada ✓ — aguardando pagamento','#1E8E5A'],partial:['Aprovada ✓ — pagamento parcial','#1E8E5A'],paid:['Paga ✓','#1E8E5A'],correction:['Correção pedida'+n+' — envie uma nova cobrança','#B3261E'],rejected:['Recusada'+n,'#B3261E'],excluded:['Cancelada pela JCN','#B3261E']}[c.status]||[c.status,'#5B6178']; return '<b style="color:'+m[1]+'">'+m[0]+'</b>'; }
async function loadHist(){
  const h=await api('charges?select=*&order=created_at.desc&limit=20');
  $('hist').innerHTML=h.length?h.map(c=>{ const tot=(c.items||[]).reduce((a,i)=>{const s=services.find(x=>x.product_id===i.product_id&&x.service===i.service);return a+(s?s.price*i.qty:0)},0);
    return `<div class="hist"><b>Pedido #${esc(c.order_code)}</b> — ${brl(tot)}<br><small>${new Date(c.created_at).toLocaleDateString('pt-BR')} · ${stLabel(c)}</small></div>`}).join(''):'<p class="sub">Nenhuma cobrança enviada ainda.</p>';
}
$('btnIn').onclick=async()=>{ $('lMsg').innerHTML=''; try{ await auth({email:$('lEmail').value.trim().toLowerCase(),password:$('lPass').value},'password'); await start(); }catch(e){ $('lMsg').innerHTML='<div class="msg err">'+esc(e.message==='Invalid login credentials'?'E-mail ou senha incorretos.':e.message)+'</div>'; } };
$('btnOut').onclick=logout; $('sOrder').onchange=drawRows;
$('btnSend').onclick=async()=>{
  const it=items(), sel=$('sOrder'), oid=sel.value; $('sMsg').innerHTML='';
  if(!oid){ $('sMsg').innerHTML='<div class="msg err">Selecione o pedido.</div>'; return; }
  if(!it.length){ $('sMsg').innerHTML='<div class="msg err">Informe a quantidade de pelo menos um serviço.</div>'; return; }
  if(!confirm('Enviar esta cobrança?')) return;
  $('btnSend').disabled=true;
  try{ await api('charges',{method:'POST',headers:Object.assign(H(),{Prefer:'return=minimal'}),body:JSON.stringify({provider_key:me.provider_key,order_id:oid,order_code:sel.selectedOptions[0].dataset.c,items:it,note:$('nNote').value.trim()||null})});
    $('sMsg').innerHTML='<div class="msg ok">Cobrança enviada! A JCN vai analisar.</div>'; document.querySelectorAll('#rows input').forEach(i=>i.value=''); $('nNote').value=''; calc(); loadHist();
  }catch(e){ $('sMsg').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'; } $('btnSend').disabled=false; };
sess=store.get(); if(sess){ start().catch(()=>logout()); }
</script></body></html>
